<!doctype html>
<html lang="de">
  <head>
    <script>
      (function () {
        try {
          var k = '4rest-ui-theme';
          var v = localStorage.getItem(k);
          var t = v === 'classic' || v === 'atlas' ? v : 'classic';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'classic');
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#115e59" />
    <meta name="description" content="Sustainability gamification platform - Grow your virtual forest through sustainable actions" />
    <title>4rest</title>
    <!-- Prefetch 3D tree models for faster ForestPage loading -->
    <link rel="prefetch" as="fetch" href="/models/twigLeafTree.glb" crossorigin="anonymous" />
    <link rel="prefetch" as="fetch" href="/models/tree.glb" crossorigin="anonymous" />
    <link rel="prefetch" as="fetch" href="/models/leaves.glb" crossorigin="anonymous" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
