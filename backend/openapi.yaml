components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/login or /auth/register

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [guest, front_office, administrator]
        points:
          type: integer
          minimum: 0
        userType:
          type: string
          enum: [explorer, guest_in_house, observer, advocate]
        emailVerified:
          type: boolean
          description: Whether the user's email has been verified
        emailNotificationsEnabled:
          type: boolean
          description: Whether the user has email notifications enabled
        sihotGuestId:
          type: string
          nullable: true
        sihotGuest:
          type: object
          nullable: true
        sihotReservations:
          type: array
          items:
            type: object
      required:
        - id
        - email
        - name
        - role

    PlayerProfile:
      type: object
      properties:
        status:
          type: string
          enum: [pending, skipped, completed]
        dyadScales:
          type: array
          nullable: true
          minItems: 4
          maxItems: 4
          items:
            type: integer
            minimum: 0
            maximum: 4
        dominantDyad:
          type: integer
          nullable: true
          minimum: 1
          maximum: 4
        profileDisplayName:
          type: string
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - status
        - dyadScales
        - dominantDyad
        - profileDisplayName
        - completedAt

    UserWithPlayerProfile:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            playerProfile:
              $ref: '#/components/schemas/PlayerProfile'

    UpdatePlayerProfileRequest:
      type: object
      properties:
        status:
          type: string
          enum: [skipped, completed]
        dyadScales:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: integer
            minimum: 0
            maximum: 4
          description: Nur bei status completed erforderlich (Dyade 1–4)
        profileDisplayName:
          type: string
          nullable: true
          maxLength: 128

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT authentication token
        user:
          $ref: '#/components/schemas/User'
      required:
        - token
        - user

    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        type:
          type: string
        points:
          type: integer
          minimum: 0
        video_url:
          type: string
          nullable: true
        quiz_questions:
          type: object
          nullable: true
        qr_code:
          type: string
          nullable: true
        photo_required:
          type: boolean
        co2_savings_kg:
          type: number
          nullable: true
        external_id:
          type: string
          nullable: true
        allowed_roles:
          type: array
          items:
            type: string
            enum: [guest, front_office, administrator]
        allowed_user_types:
          type: array
          items:
            type: string
            enum: [explorer, guest_in_house, observer, advocate]
        allowed_hotel_ids:
          type: array
          items:
            type: string
            enum: [ROI-BER, ROI-VIE]
        location_id:
          type: string
          format: uuid
          description: Identifier of the location associated with this task
        location:
          $ref: '#/components/schemas/Location'
        active:
          type: boolean
        prerequisite_task_id:
          type: string
          format: uuid
          nullable: true
          description: ID of a specific task that must be completed before this task becomes available (Type 1 prerequisite)
        prerequisite_task_count:
          type: integer
          minimum: 1
          nullable: true
          description: Minimum number of tasks from prerequisite_task_ids that must be completed (Type 2 prerequisite)
        prerequisite_task_ids:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
          description: Array of task IDs from which prerequisite_task_count must be completed (Type 2 prerequisite)
        is_available:
          type: boolean
          nullable: true
          description: Whether this task is available to the current user (based on prerequisite completion)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - title
        - type
        - points
        - location_id

    TaskCreate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        type:
          type: string
        points:
          type: integer
          minimum: 0
        video_url:
          type: string
        quiz_questions:
          type: object
        qr_code:
          type: string
        photo_required:
          type: boolean
        co2_savings_kg:
          type: number
        external_id:
          type: string
        allowed_roles:
          type: array
          items:
            type: string
            enum: [guest, front_office, administrator]
        allowed_user_types:
          type: array
          items:
            type: string
            enum: [explorer, guest_in_house, observer, advocate]
        allowed_hotel_ids:
          type: array
          items:
            type: string
            enum: [ROI-BER, ROI-VIE]
        locationId:
          type: string
          format: uuid
          description: ID of the location associated with the task
        active:
          type: boolean
        prerequisite_task_id:
          type: string
          format: uuid
          description: ID of a specific task that must be completed before this task becomes available (Type 1 prerequisite)
        prerequisite_task_count:
          type: integer
          minimum: 1
          description: Minimum number of tasks from prerequisite_task_ids that must be completed (Type 2 prerequisite)
        prerequisite_task_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Array of task IDs from which prerequisite_task_count must be completed (Type 2 prerequisite)
      required:
        - title
        - type
        - points
        - locationId

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        type:
          type: string
        points:
          type: integer
          minimum: 0
        video_url:
          type: string
        quiz_questions:
          type: object
        qr_code:
          type: string
        photo_required:
          type: boolean
        co2_savings_kg:
          type: number
        external_id:
          type: string
        allowed_roles:
          type: array
          items:
            type: string
            enum: [guest, front_office, administrator]
        allowed_user_types:
          type: array
          items:
            type: string
            enum: [explorer, guest_in_house, observer, advocate]
        allowed_hotel_ids:
          type: array
          items:
            type: string
            enum: [ROI-BER, ROI-VIE]
        locationId:
          type: string
          format: uuid
        active:
          type: boolean
        prerequisite_task_id:
          type: string
          format: uuid
          description: ID of a specific task that must be completed before this task becomes available (Type 1 prerequisite)
        prerequisite_task_count:
          type: integer
          minimum: 1
          description: Minimum number of tasks from prerequisite_task_ids that must be completed (Type 2 prerequisite)
        prerequisite_task_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Array of task IDs from which prerequisite_task_count must be completed (Type 2 prerequisite)

    Reward:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        points_cost:
          type: integer
          minimum: 0
        reward_type:
          type: string
          enum: [discount, voucher, benefit, team_event]
        voucher_code:
          type: string
          nullable: true
        external_api_id:
          type: string
          nullable: true
        active:
          type: boolean
        allowed_roles:
          type: array
          items:
            type: string
            enum: [guest, front_office, administrator]
        allowed_user_types:
          type: array
          items:
            type: string
            enum: [explorer, guest_in_house, observer, advocate]
        allowed_hotel_ids:
