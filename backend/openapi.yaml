openapi: 3.0.3
info:
  title: 4rest API
  description: |
    API for the 4rest gamification platform. This API provides endpoints for:
    - User authentication and management
    - Task management and completion
    - Reward system
    - Forest/gamification features
    - Statistics and analytics
    - GDPR compliance
    - Integration with HotelKit and Sihot systems
  version: 1.0.0
  contact:
    name: 4rest
servers:
  - url: http://localhost:5001/api
    description: Development server
  - url: https://api.4rest.com/api
    description: Production server

tags:
  - name: Authentication
    description: User authentication and registration
  - name: Tasks
    description: Task management and completion
  - name: Rewards
    description: Reward system and redemption
  - name: Users
    description: User profile and progress
  - name: Locations
    description: Manage locations used by tasks and rewards
  - name: Forest
    description: Forest/gamification features
  - name: Statistics
    description: Statistics and analytics
  - name: GDPR
    description: GDPR compliance endpoints
  - name: HotelKit
    description: HotelKit integration
  - name: Sihot
    description: Sihot PMS integration

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check if the API is running
      security: []
      responses:
        '200':
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login
      description: Authenticate user with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: password123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid credentials
        '403':
          description: Email verification required or password setup required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Email verification required
                  code:
                    type: string
                    enum: ['EMAIL_NOT_VERIFIED', 'PASSWORD_SETUP_REQUIRED']
                    example: PASSWORD_SETUP_REQUIRED
                  email:
                    type: string
                    format: email
                    example: user@example.com
                  message:
                    type: string
                    example: This account uses passwordless login. A password setup link has been sent to your email. Please check your inbox to set a password.

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register
      description: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 6
                name:
                  type: string
                  minLength: 2
                role:
                  type: string
                  enum: [guest, front_office, administrator]
                  default: guest
                userType:
                  type: string
                  enum: [explorer, guest_in_house, observer, advocate]
                  default: explorer
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh token
      description: Refresh authentication token
      security: []
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string

  /auth/github:
    get:
      tags:
        - Authentication
      summary: GitHub OAuth
      description: Initiate GitHub OAuth flow
      security: []
      responses:
        '302':
          description: Redirect to GitHub

  /auth/github/callback:
    get:
      tags:
        - Authentication
      summary: GitHub OAuth callback
      description: GitHub OAuth callback handler
      security: []
      responses:
        '302':
          description: Redirect after authentication

  /auth/google:
    get:
      tags:
        - Authentication
      summary: Google OAuth
      description: Initiate Google OAuth flow
      security: []
      responses:
        '302':
          description: Redirect to Google

  /auth/google/callback:
    get:
      tags:
        - Authentication
      summary: Google OAuth callback
      description: Google OAuth callback handler
      security: []
      responses:
        '302':
          description: Redirect to frontend with JWT token

  /auth/facebook:
    get:
      tags:
        - Authentication
      summary: Facebook OAuth
      description: Initiate Facebook OAuth flow
      security: []
      responses:
        '302':
          description: Redirect to Facebook

  /auth/facebook/callback:
    get:
      tags:
        - Authentication
      summary: Facebook OAuth callback
      description: Facebook OAuth callback handler
      security: []
      responses:
        '302':
          description: Redirect to frontend with JWT token

  /auth/apple:
    get:
      tags:
        - Authentication
      summary: Apple OAuth (Sign in with Apple)
      description: Initiate Apple OAuth flow
      security: []
      responses:
        '302':
          description: Redirect to Apple

  /auth/apple/callback:
    get:
      tags:
        - Authentication
      summary: Apple OAuth callback
      description: Apple OAuth callback handler
      security: []
      responses:
        '302':
          description: Redirect to frontend with JWT token

  /auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset
      description: Request a password reset email. Always returns success to prevent email enumeration.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
      responses:
        '200':
          description: Password reset email sent (if account exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: If an account exists with this email, a password reset link has been sent.
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password or set password
      description: |
        Reset password using a token from the password reset email, or set a password for a passwordless account using a token from the password setup email.
        
        This endpoint handles both:
        - Password reset: For accounts that already have a password
        - Password setup: For passwordless accounts (accounts created via passwordless login)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                  description: Password reset/setup token from email
                  example: abc123def456...
                password:
                  type: string
                  format: password
                  minLength: 6
                  description: New password (for reset) or password to set (for setup)
                  example: newpassword123
      responses:
        '200':
          description: Password reset or set successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password has been reset successfully
                    description: |
                      Message varies based on operation:
                      - "Password has been reset successfully" for password reset
                      - "Password has been set successfully. You can now sign in with your email and password." for password setup
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/verify-email:
    post:
      tags:
        - Authentication
      summary: Verify email address
      description: Verify email address using a token from the verification email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: Email verification token from email
                  example: abc123def456...
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Email verified successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/resend-verification:
    post:
      tags:
        - Authentication
      summary: Resend verification email
      description: Resend email verification email to the authenticated user
      requestBody:
        required: false
      responses:
        '200':
          description: Verification email sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Verification email sent successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/request-login-code:
    post:
      tags:
        - Authentication
      summary: Request login code
      description: |
        Request a passwordless login code via email. The code expires in 10 minutes and can only be used once.
        
        If no account exists with the given email, a new account will be created automatically with:
        - Email verified (since they're receiving the code at this email)
        - Default role: guest
        - Default user type: explorer
        - Name extracted from email address
        - No password (passwordless account)
        
        For existing accounts, email verification is required.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: Email address of the user
                  example: user@example.com
      responses:
        '200':
          description: Login code sent (account created if it didn't exist)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: If an account exists with this email, a login code has been sent.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Email verification required
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Email verification required
                  message:
                    type: string
                    example: Please verify your email address before using passwordless login.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login-with-code:
    post:
      tags:
        - Authentication
      summary: Login with code
      description: Authenticate user using a login code received via email. The code is single-use and expires after 10 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
              properties:
                email:
                  type: string
                  format: email
                  description: Email address of the user
                  example: user@example.com
                code:
                  type: string
                  pattern: '^[0-9]{6}$'
                  description: 6-digit login code from email
                  example: '123456'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid or expired login code
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid or expired login code
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tasks:
    get:
      tags:
        - Tasks
      summary: Get tasks
      description: Get list of tasks with optional filtering
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
        - name: type
          in: query
          schema:
            type: string
        - name: includeAll
          in: query
          schema:
            type: boolean
          description: Include all tasks (admin only)
        - name: includeInactive
          in: query
          schema:
            type: boolean
          description: Include inactive tasks (admin only)
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Tasks
      summary: Create task
      description: Create a new task (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tasks/bulk/status:
    post:
      tags:
        - Tasks
      summary: Bulk update task status
      description: Update active status for multiple tasks (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
                - active
              properties:
                ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                active:
                  type: boolean
      responses:
        '200':
          description: Tasks updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tasks/bulk/delete:
    post:
      tags:
        - Tasks
      summary: Bulk delete tasks
      description: Permanently delete multiple tasks (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Tasks deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tasks/upload:
    post:
      tags:
        - Tasks
      summary: Upload task photo
      description: Upload a photo for task completion
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - photo
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Photo uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /tasks/upload/video:
    post:
      tags:
        - Tasks
      summary: Upload task video
      description: Upload a video file for a task (admin only)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - video
              properties:
                video:
                  type: string
                  format: binary
      responses:
        '200':
          description: Video uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tasks/{id}:
    get:
      tags:
        - Tasks
      summary: Get task by ID
      description: Get a single task by ID
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Tasks
      summary: Update task
      description: Update an existing task (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Tasks
      summary: Delete task
      description: Permanently delete a task (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{id}/complete:
    post:
      tags:
        - Tasks
      summary: Complete task
      description: Mark a task as completed by the current user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                photo_url:
                  type: string
                quiz_answers:
                  type: object
      responses:
        '200':
          description: Task completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  points_earned:
                    type: integer
                  tree_planted:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /rewards:
    get:
      tags:
        - Rewards
      summary: Get rewards
      description: Get list of available rewards for the current user
      responses:
        '200':
          description: List of rewards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reward'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Rewards
      summary: Create reward
      description: Create a new reward (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RewardCreate'
      responses:
        '201':
          description: Reward created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reward'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /rewards/templates:
    get:
      tags:
        - Rewards
      summary: Get reward templates
      description: Get all rewards including inactive ones (admin only)
      parameters:
        - name: includeInactive
          in: query
          schema:
            type: boolean
          description: Include inactive rewards
      responses:
        '200':
          description: List of rewards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reward'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /rewards/bulk/status:
    post:
      tags:
        - Rewards
      summary: Bulk update reward status
      description: Update active status for multiple rewards (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
                - active
              properties:
                ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                active:
                  type: boolean
      responses:
        '200':
          description: Rewards updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /rewards/bulk/delete:
    post:
      tags:
        - Rewards
      summary: Bulk delete rewards
      description: Permanently delete multiple rewards (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Rewards deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /rewards/{id}:
    put:
      tags:
        - Rewards
      summary: Update reward
      description: Update an existing reward (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RewardUpdate'
      responses:
        '200':
          description: Reward updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reward'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /rewards/{id}/redeem:
    post:
      tags:
        - Rewards
      summary: Redeem reward
      description: Redeem a reward for the current user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reward redeemed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  redemption:
                    $ref: '#/components/schemas/RewardRedemption'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /locations:
    get:
      tags:
        - Locations
      summary: List locations
      description: Retrieve all locations (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: includeInactive
          in: query
          schema:
            type: boolean
          description: Include inactive locations
      responses:
        '200':
          description: List of locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Location'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Locations
      summary: Create location
      description: Create a new location (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationCreate'
      responses:
        '201':
          description: Location created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /locations/{id}:
    put:
      tags:
        - Locations
      summary: Update location
      description: Update an existing location (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
