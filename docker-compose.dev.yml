services:
  postgres:
    image: postgres:15-alpine
    container_name: roots-postgres
    environment:
      POSTGRES_USER: roots_user
      POSTGRES_PASSWORD: roots_password
      POSTGRES_DB: roots_of_impact
    ports:
      # 5433 oft durch andere lokale DBs belegt → 5434 für 4rest-Dev
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roots_user -d roots_of_impact"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: roots-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
