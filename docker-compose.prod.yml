version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: roots-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - roots-network

  redis:
    image: redis:7-alpine
    container_name: roots-redis-prod
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - roots-network

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prod
    container_name: roots-backend-prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      BASE_URL: ${BASE_URL}
      HOTELKIT_API_URL: ${HOTELKIT_API_URL}
      HOTELKIT_API_KEY: ${HOTELKIT_API_KEY}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - roots-network
    ports:
      - "5000:5000"

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.prod
    container_name: roots-frontend-prod
    environment:
      VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    networks:
      - roots-network
    ports:
      - "80:3000"

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  roots-network:
    driver: bridge
