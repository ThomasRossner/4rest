name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  e2e-tests:
    # Playwright 1.57 liefert keine Chromium-Builds für Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: roots_user
          POSTGRES_PASSWORD: roots_password
          POSTGRES_DB: roots_of_impact
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Setup environment variables
        run: |
          echo "DATABASE_URL=postgresql://roots_user:roots_password@localhost:5432/roots_of_impact" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379" >> $GITHUB_ENV
          echo "API_URL=http://localhost:5002/api" >> $GITHUB_ENV
          echo "BASE_URL=http://localhost:3002" >> $GITHUB_ENV
          echo "JWT_SECRET=ci-test-jwt-secret" >> $GITHUB_ENV
          echo "SESSION_SECRET=ci-test-session-secret" >> $GITHUB_ENV
          echo "EMAIL_MOCK_MODE=true" >> $GITHUB_ENV

      - name: Run database migrations
        run: |
          cd backend
          npm run migrate

      - name: Run E2E tests
        # Voller Lauf: npm run test:e2e (vier Browser, Seed-Daten, Live-Specs gegen luise.bio).
        # CI prüft, dass die App startet und die Anmeldung eine Fehlermeldung zeigt.
        run: npx playwright test e2e/specs/smoke --project=chromium
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos
          path: test-results/
          retention-days: 7
